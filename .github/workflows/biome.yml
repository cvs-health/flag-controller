# Reusable workflow for Biome formatting and auto-fix commit.
# If formatting issues are found, the fixes are committed back to the PR branch.
name: Biome Format

on:
  workflow_call:

permissions:
  contents: write

jobs:
  biome-format:
    name: Format Fix
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: 24.13.0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable pnpm via Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome format with auto-fix
        run: pnpm biome format --write .

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5.2.0
        with:
          commit_message: "ci: auto-fix biome formatting"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
