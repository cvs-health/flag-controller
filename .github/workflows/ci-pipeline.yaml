name: CI pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize]

permissions:
  id-token: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Enable pnpm via Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: 🛠 Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Fetch main branch
        if: github.ref_name != 'main'
        run: git fetch origin main:main

      - name: 👷 Build
        run: pnpm turbo build --affected

  format-and-fix:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/biome.yml
    secrets: inherit

  format-check:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enable pnpm via Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Biome formatting
        run: pnpm biome format .

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Enable pnpm via Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: 🛠 Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Fetch main branch
        if: github.ref_name != 'main'
        run: git fetch origin main:main

      - name: 🛠 Test Affected Projects (with coverage)
        run: pnpm turbo run test:ci --affected

  ui-build-and-scan:
    uses: ./.github/workflows/image-build.yaml
    permissions:
      contents: read
      security-events: write
    secrets: inherit
    with:
      app: ui

  api-build-and-scan:
    uses: ./.github/workflows/image-build.yaml
    permissions:
      contents: read
      security-events: write
    secrets: inherit
    with: 
      app: api
  
  docs-build-and-scan:
    uses: ./.github/workflows/image-build.yaml
    permissions:
      contents: read
      security-events: write
    secrets: inherit
    with:
      app: docs
