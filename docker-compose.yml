name: flag-controller
services:
  ui:
    build:
      context: .
      dockerfile: ./apps/ui/Dockerfile
      args:
        - NEXT_PUBLIC_BETTER_AUTH_URL=http://localhost:8080
    env_file:
      - ./apps/ui/.env
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - API_BASE_URL=http://api:8080/
      - BETTER_AUTH_URL=http://api:8080/
    ports:
      - "3000:3000"
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    env_file:
      - ./apps/api/.env
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - DATABASE_URL=postgres://feature-flagging-platform:password@db:5432/feature-flag-db
      - CORS_ORIGIN=http://localhost:3000
      - BETTER_AUTH_URL=http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "require('http').get('http://127.0.0.1:8080/healthz',res=>process.exit(res.statusCode>=200&&res.statusCode<300?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
  flagd:
    image: ghcr.io/open-feature/flagd:v0.16.2
    command: ["--debug", "start", "--log-format", "json"]
    ports:
      - "8013:8013" # Evaluation (gRPC/HTTP)
      - "8016:8016" # OFREP
    environment:
      - FLAGD_SOURCES=[{"uri":"http://api:8080/flagd","provider":"http"}]
    depends_on:
      api:
        condition: service_healthy
  docs:
    build:
      context: .
      dockerfile: ./apps/docs/Dockerfile
    ports:
      - "3001:3000"
  db:
    image: postgres:18.6
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feature-flagging-platform -d feature-flag-db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: feature-flag-db
      POSTGRES_USER: feature-flagging-platform
      POSTGRES_PASSWORD: password

volumes:
  pgdata:
